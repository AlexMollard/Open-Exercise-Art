name: Publish gallery

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'gallery.*'
      - 'catalogue.json'
      - 'png/**'
      - 'svg/**'
      - 'LICENSE*'
      - 'ATTRIBUTION.md'
      - 'PROVENANCE.md'
      - 'tools/package_site.py'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the public collection
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Package verified static gallery files
        run: python3 tools/package_site.py --output "$RUNNER_TEMP/pages-site"
      - name: Upload the Pages deployment bundle
        id: upload
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/pages-site
          retention-days: 1
          include-hidden-files: true
      - name: Publish the gallery
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
      - name: Remove the temporary deployment bundle
        if: ${{ always() && steps.upload.outputs.artifact_id != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact_id }}
        run: gh api --method DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID"
